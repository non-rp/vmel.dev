server {
    listen 443 ssl;
    server_name vmel.dev;
    root /var/www/vmel.dev/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vmel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name www.vmel.dev;
    ssl_certificate /etc/letsencrypt/live/vmel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vmel.dev$request_uri;
}

server {
    listen 80;
    server_name vmel.dev www.vmel.dev;
    return 301 https://vmel.dev$request_uri;
}
