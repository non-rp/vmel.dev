server {
    listen 443 ssl;
    server_name vmel.dev;

    ssl_certificate /etc/letsencrypt/live/vmel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name www.vmel.dev;
    ssl_certificate /etc/letsencrypt/live/vmel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vmel.dev$request_uri;
}

server {
    listen 80;
    server_name vmel.dev www.vmel.dev;
    return 301 https://vmel.dev$request_uri;
}
