name: vmel-development
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: vmel
      POSTGRES_PASSWORD: vmel
      POSTGRES_DB: vmel
    ports: ["127.0.0.1:5440:5432"]
    volumes: ["../../.qa/development/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vmel -d vmel"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports: ["127.0.0.1:6380:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
