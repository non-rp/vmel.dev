name: vmel-portfolio

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    image: ${VMEL_IMAGE:?Set VMEL_IMAGE to the tested release image}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://vmel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/vmel
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    ports: ["127.0.0.1:4174:3000"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: vmel
      POSTGRES_DB: vmel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vmel -d vmel"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m
    cpus: 0.5
    logging: *logging
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 96m
    cpus: 0.25
    logging: *logging

volumes:
  postgres-data:
